services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: privacy-code-security-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    plan: free

  # -------------------------------------------------------------
  # 2. Frontend Web Service / Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: privacy-code-security-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: privacy-code-security-api
          property: host
    plan: free
